<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python daftari</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Maket: katakli daftar fonida, tepada sticky sarlavha, ustida 30 katakli progress, pastda hafta bo'yicha dars jadvali. Kun sahifasi: maqsad, nazariya, kod, vazifalar. */
:root {
  --bg: #F1F5F2;
  --surface: #FFFFFF;
  --ink: #16201B;
  --ink-2: #4B5A52;
  --line: #D3DCD6;
  --grid: #E4EAE6;
  --accent: #2557C9;
  --accent-ink: #FFFFFF;
  --mark-bg: #FFEC8F;
  --ok: #1B8A55;
  --ok-bg: #DDF2E6;
  --on-ok: #FFFFFF;
  --code-bg: #14201A;
  --code-fg: #E3EDE7;
  --code-bar: #1E2D26;
  --code-dim: #8EA396;
  --tok-kw: #FF8FA3;
  --tok-str: #A8E08A;
  --tok-num: #FFD166;
  --tok-fn: #7FC4FF;
  --tok-com: #7F9488;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Onest', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1613; --surface: #17211C; --ink: #E7EEE9; --ink-2: #A3B2A9; --line: #2B3A32; --grid: #19241F;
    --accent: #8CB0FF; --accent-ink: #0B1530; --mark-bg: #4D4310; --ok: #4CC58A; --ok-bg: #16382A; --on-ok: #06190F;
    --code-bg: #0A110E; --code-fg: #DCE7E0; --code-bar: #15201B; --code-dim: #7F9488;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1613; --surface: #17211C; --ink: #E7EEE9; --ink-2: #A3B2A9; --line: #2B3A32; --grid: #19241F;
  --accent: #8CB0FF; --accent-ink: #0B1530; --mark-bg: #4D4310; --ok: #4CC58A; --ok-bg: #16382A; --on-ok: #06190F;
  --code-bg: #0A110E; --code-fg: #DCE7E0; --code-bar: #15201B; --code-dim: #7F9488;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4, p, ul { margin: 0; }

/* sarlavha */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.brand { background: none; border: 0; padding: 8px 0; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 4px; }
.brand .mk { background: var(--mark-bg); padding: 0 6px; border-radius: 3px; }
.pill { font-family: var(--font-mono); font-size: 0.8rem; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-variant-numeric: tabular-nums; }

main { padding-top: 24px; }

/* bosh sahifa */
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 10vw, 3.6rem); line-height: 1; letter-spacing: -0.03em; text-wrap: balance; }
.hero h1 .mk { background: linear-gradient(transparent 58%, var(--mark-bg) 58% 92%, transparent 92%); padding: 0 2px; }
.hero .lead { margin-top: 14px; color: var(--ink-2); max-width: 52ch; }

.board { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 16px; }
.board-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.count { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 0.9; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.count small { font-size: 1.1rem; font-weight: 600; color: var(--ink-2); letter-spacing: 0; margin-left: 6px; }
.pct { font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-2); }
.cells { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.cell { aspect-ratio: 1; max-width: 100%; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); font-family: var(--font-mono); font-size: 0.7rem; padding: 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cell.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cell.next { border-color: var(--accent); color: var(--ink); border-width: 2px; }
.cell.today { box-shadow: 0 0 0 2px var(--mark-bg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.78rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid var(--line); vertical-align: -1px; margin-right: 6px; background: var(--surface); }
.legend i.d { background: var(--accent); border-color: var(--accent); }
.legend i.n { border-color: var(--accent); border-width: 2px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink); min-height: 46px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.small { min-height: 38px; padding: 8px 14px; font-size: 0.9rem; }
.finished { font-weight: 600; }
.datebox { display: grid; gap: 4px; font-size: 0.85rem; color: var(--ink-2); }
.datebox input { font: inherit; font-family: var(--font-mono); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 42px; }

.sched-title { margin-top: 36px; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; letter-spacing: -0.02em; }
.sched-note { color: var(--ink-2); font-size: 0.92rem; margin-top: 4px; }
.week { margin-top: 26px; }
.week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.week-name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; text-wrap: balance; min-width: 0; }
.week-meta { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 2px; }
.week-count { font-family: var(--font-mono); font-size: 0.82rem; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rows { list-style: none; padding: 0; display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.row.done { background: var(--ok-bg); border-color: transparent; }
.tick { width: 52px; height: 56px; background: none; border: 0; display: grid; place-items: center; padding: 0; }
.tick .box { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink-2); display: grid; place-items: center; color: transparent; transition: background 0.15s, border-color 0.15s; }
.tick[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.open { background: none; border: 0; text-align: left; padding: 12px 14px 12px 0; display: grid; gap: 2px; min-width: 0; }
.when { font-family: var(--font-mono); font-size: 0.74rem; color: var(--ink-2); letter-spacing: 0.02em; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.today-badge { background: var(--mark-bg); color: var(--ink); border-radius: 999px; padding: 0 8px; font-weight: 500; }
.ttl { font-weight: 600; line-height: 1.3; text-wrap: balance; }
.sub { font-size: 0.8rem; color: var(--ink-2); }

/* kun sahifasi */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 18px; }
.back { background: none; border: 0; padding: 8px 4px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; min-height: 42px; }
.pn { display: flex; gap: 6px; }
.sq { width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.sq:disabled { opacity: 0.35; cursor: default; }
.eyebrow { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.day-title { margin-top: 8px; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.7rem, 7vw, 2.5rem); line-height: 1.08; letter-spacing: -0.025em; text-wrap: balance; }
.chips { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 0.82rem; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; }
.chip.ok { background: var(--ok-bg); border-color: transparent; color: var(--ink); font-weight: 600; }
.goal { margin-top: 20px; background: var(--mark-bg); border-radius: 10px; padding: 14px 16px; }
.goal b { display: block; font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
.sec { margin-top: 34px; }
.sec-h { display: flex; align-items: center; gap: 12px; font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; margin-bottom: 14px; }
.sec-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sec-h .cnt { order: 3; font-variant-numeric: tabular-nums; }
.concept + .concept { margin-top: 18px; }
.concept h4 { font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; letter-spacing: -0.01em; margin-bottom: 4px; }
.concept p { max-width: 65ch; }
code.i { font-family: var(--font-mono); font-size: 0.88em; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.code { background: var(--code-bg); color: var(--code-fg); border-radius: 12px; overflow: hidden; margin: 0; }
.code-bar { display: flex; justify-content: space-between; align-items: center; background: var(--code-bar); padding: 6px 8px 6px 14px; font-family: var(--font-mono); font-size: 0.74rem; color: var(--code-dim); letter-spacing: 0.06em; text-transform: uppercase; }
.copy { background: none; border: 1.5px solid var(--code-dim); color: var(--code-fg); border-radius: 8px; padding: 5px 12px; font-size: 0.8rem; min-height: 34px; }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.84rem; line-height: 1.65; tab-size: 4; }
.t-k { color: var(--tok-kw); } .t-s { color: var(--tok-str); } .t-n { color: var(--tok-num); } .t-f { color: var(--tok-fn); } .t-c { color: var(--tok-com); font-style: italic; }
.tasks { list-style: none; padding: 0; display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.task input { appearance: none; -webkit-appearance: none; margin: 1px 0 0; width: 24px; height: 24px; border: 2px solid var(--ink-2); border-radius: 6px; background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.task input:checked { background: var(--accent); border-color: var(--accent); }
.task input:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.task.on span { color: var(--ink-2); text-decoration: line-through; text-decoration-thickness: 1px; }
.finish { margin-top: 38px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 12px; }
.finish.done { background: var(--ok-bg); border-color: transparent; }
.finish p { color: var(--ink-2); }
.finish .btn { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.finish.done .btn { background: transparent; color: var(--ink); border: 1.5px solid var(--ink-2); }
.nav2 { margin-top: 16px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* pastki qism */
.foot { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 14px; font-size: 0.88rem; color: var(--ink-2); }
.foot details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.foot summary { cursor: pointer; font-weight: 600; color: var(--ink); min-height: 28px; }
.foot textarea { width: 100%; margin-top: 10px; font-family: var(--font-mono); font-size: 0.76rem; background: var(--bg); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
.foot .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.msg { font-size: 0.85rem; }
.reset-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

@media (max-width: 420px) {
  .cells { gap: 3px; }
  .cell { font-size: 0.64rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>

<style>body{margin:0}</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" id="brand" type="button" aria-label="Bosh sahifa"><span class="mk">Python</span><span>daftari</span></button>
    <span class="pill" id="pill" aria-live="polite">0/30</span>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
(function () {
  "use strict";

  /* ---------- Dars mazmuni ---------- */
  var WEEKS = [
    { t: "Asoslar va shartlar", a: 1, b: 7 },
    { t: "Sikllar va ma'lumotlar to'plami", a: 8, b: 14 },
    { t: "Funksiyalar, fayllar va xatolar", a: 15, b: 21 },
    { t: "Modullar, OOP va kutubxonalar", a: 22, b: 28 },
    { t: "Algoritmlar va yakuniy loyiha", a: 29, b: 30 }
  ];

  var DAYS = [
    /* 1 */ {
      t: "Python bilan tanishuv va birinchi dastur", v: 60,
      g: "Python nima ekanini bilish, kompyuterga o'rnatish va birinchi dasturni ishga tushirish.",
      th: [
        ["Python nima?", "Python odam o'qishi oson bo'lgan dasturlash tili. Veb-saytlar, sun'iy intellekt, ma'lumotlar tahlili, o'yinlar va kundalik ishlarni avtomatlashtirishda ishlatiladi."],
        ["O'rnatish", "python.org saytidan Python 3 ni yuklab oling. Windows'da o'rnatishda “Add Python to PATH” katagini belgilang. Tekshirish uchun terminalda §python --version§ yozing."],
        ["Kod yozish joyi", "Yangi boshlovchilar uchun Thonny yoki VS Code qulay. Python fayllari §.py§ bilan tugaydi, masalan §salom.py§."],
        ["print() funksiyasi", "§print()§ ekranga yozuv chiqaradi. Matn qo'shtirnoq ichiga yoziladi: §\"Salom\"§ yoki §'Salom'§."],
        ["Izohlar", "§#§ belgisidan keyingi qism Python tomonidan o'qilmaydi. Izoh kodni tushuntirish uchun yoziladi."]
      ],
      c: String.raw`# Mening birinchi dasturim
print("Salom, dunyo!")
print("Men Python o'rganyapman")
print(2026)`,
      p: [
        "Python'ni o'rnating va terminalda §python --version§ natijasini ko'ring.",
        "§salom.py§ faylini yarating va ichiga “Salom, dunyo!” chiqaruvchi kod yozing.",
        "Ismingiz, yoshingiz va shahringizni 3 ta alohida §print§ bilan chiqaring."
      ],
      w: [
        "O'zingiz haqingizda 5 qatorli kichik vizitka chiqaring.",
        "Bir qator boshiga §#§ qo'yib ishga tushiring va nima o'zgarganini daftaringizga yozing.",
        "§print(\"Salom\"§ deb qavsni yopmasdan ishga tushiring va chiqqan xatoni o'qib ko'ring."
      ]
    },
    /* 2 */ {
      t: "O'zgaruvchilar va ma'lumot turlari", v: 60,
      g: "Ma'lumotni nom bilan saqlashni va asosiy turlarni (int, float, str, bool) ajrata olishni o'rganish.",
      th: [
        ["O'zgaruvchi", "O'zgaruvchi ma'lumot saqlanadigan nomli quti. §yosh = 20§ yozsangiz, “yosh” qutisiga 20 solinadi."],
        ["Nom berish qoidalari", "Nom harf yoki §_§ bilan boshlanadi, raqam bilan boshlanmaydi. Katta va kichik harf farq qiladi: §Ali§ va §ali§ boshqa-boshqa. Odatda §kichik_harf_va_pastki_chiziq§ yoziladi."],
        ["Asosiy turlar", "§int§ butun son, §float§ kasr son, §str§ matn, §bool§ esa §True§ yoki §False§ qiymati."],
        ["type() funksiyasi", "§type(x)§ qiymat qaysi turda ekanini ko'rsatadi."]
      ],
      c: String.raw`ism = "Ali"
yosh = 20
bo_y = 1.75
talaba_mi = True

print(ism, yosh, bo_y, talaba_mi)
print(type(ism))
print(type(yosh))
print(type(bo_y))
print(type(talaba_mi))

yosh = yosh + 1
print("Yangi yosh:", yosh)`,
      p: [
        "4 xil turdagi o'zgaruvchi yarating va §type§ bilan turini tekshiring.",
        "§a = 5§ va §b = 10§ ni almashtiring (a ga 10, b ga 5 tushsin). Maslahat: §a, b = b, a§.",
        "Nima uchun §1ism = \"Ali\"§ xato berishini o'zingizcha tushuntiring."
      ],
      w: [
        "O'zingiz haqingizda o'zgaruvchilar yarating (ism, yosh, bo'y, o'quvchi_mi) va chiqaring.",
        "Tovar nomi, narxi va sonini o'zgaruvchilarga yozib, jami narxni hisoblang.",
        "Qaysi nomlar to'g'ri: §my_name§, §2nd§, §_x§, §my-name§, §Name§? Daftaringizga yozing."
      ]
    },
    /* 3 */ {
      t: "Arifmetika va input", v: 60,
      g: "Hisob-kitob amallarini bajarish va foydalanuvchidan ma'lumot olishni o'rganish.",
      th: [
        ["Amallar", "§+§ qo'shish, §-§ ayirish, §*§ ko'paytirish, §/§ bo'lish, §//§ butun bo'lish, §%§ qoldiq, §**§ daraja."],
        ["Ustuvorlik", "Avval qavs, keyin daraja, keyin ko'paytirish/bo'lish, oxirida qo'shish/ayirish bajariladi. Shubha bo'lsa qavs ishlating."],
        ["input()", "§input()§ foydalanuvchi yozganini oladi. U doim matn (§str§) qaytaradi, shuning uchun son kerak bo'lsa §int()§ yoki §float()§ bilan aylantiring."],
        ["round()", "§round(3.14159, 2)§ sonni 2 xona aniqlikda yaxlitlaydi."]
      ],
      c: String.raw`a = 17
b = 5
print(a + b)   # 22
print(a - b)   # 12
print(a * b)   # 85
print(a / b)   # 3.4
print(a // b)  # 3  (butun bo'lish)
print(a % b)   # 2  (qoldiq)
print(a ** 2)  # 289 (daraja)

son = int(input("Son kiriting: "))
print("Kvadrati:", son ** 2)`,
      p: [
        "Ikki son kiritib, yig'indi, ayirma, ko'paytma va bo'linmani chiqaring.",
        "Sekundlar sonini (masalan 3725) soat, daqiqa va sekundga ajrating. Javob: 1 soat 2 daqiqa 5 sekund.",
        "Doira radiusini kiritib, yuzini hisoblang (pi = 3.14)."
      ],
      w: [
        "Selsiyni Farengeytga o'giring: §F = C * 9 / 5 + 32§.",
        "Narx va chegirma foizini kiritib, to'lanadigan summani chiqaring.",
        "Ikki xonali sonning raqamlari yig'indisini §//§ va §%§ yordamida toping."
      ]
    },
    /* 4 */ {
      t: "Satrlar (string)", v: 60,
      g: "Matn bilan ishlash: indeks, kesish, birlashtirish va uzunlik.",
      th: [
        ["Satr yaratish", "Matn §'...'§ yoki §\"...\"§ ichida yoziladi. Ko'p qatorli matn uchun §\"\"\"...\"\"\"§ ishlatiladi."],
        ["Indeks", "Harflar 0 dan boshlab raqamlanadi. §soz[0]§ birinchi harf, §soz[-1]§ oxirgi harf."],
        ["Kesish (slice)", "§soz[a:b]§ a dan b gacha (b kirmaydi) qismni oladi. §soz[::-1]§ matnni teskari qiladi."],
        ["Amallar", "§+§ matnlarni ulaydi, §*§ takrorlaydi, §len()§ uzunlikni beradi."]
      ],
      c: String.raw`soz = "Python"
